<!doctype html><body><h1>Isolation probes</h1><pre id="result"></pre><button id="navigate">Attempt external navigation</button><script>let results={};try{parent.document.body.dataset.hacked='yes';results.parent=true}catch(e){results.parent=false}try{results.cookie=document.cookie}catch(e){results.cookie='blocked'}fetch('https://example.invalid/network-probe').then(()=>results.fetch=true).catch(()=>{results.fetch=false;document.querySelector('#result').textContent=JSON.stringify(results)});document.querySelector('#navigate').onclick=()=>location.href='https://example.invalid/navigation-probe';</script></body>
