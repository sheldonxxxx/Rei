# Dodai · 土台: what Rei and other services on this machine both call. Today that is the gateway (models, web search,
# embeddings), the reader (web pages as text), and storage: Garage (objects) and Qdrant (search indexes). It holds
# callers' data, each caller in its own bucket, and reads none of it. It is a compose project of its own, so it keeps
# serving while Rei is stopped or redeployed; Rei's own stack is compose.yaml. ./rei starts this project first and waits
# for it. The gateway and reader images are named as in compose.yaml; in a checkout, compose.dodai.build.yaml builds them
# from source. By hand, in a checkout, from the repository root (both env files, as for compose.yaml):
#   containers/init.sh        (also creates the external volumes below)
#   docker compose --env-file containers/.env --env-file containers/.secrets/secrets.env -f containers/compose.dodai.yaml -f containers/compose.dodai.build.yaml up -d --build --wait
#
# Callers (docs/gateway-callers.md, docs/adr/0018). The gateway serves two listeners from one process:
#   internal  <net>.235.2:8780 and 127.0.0.1:8780. Every route. Rei's control plane reaches it over gateway-admin with
#             its own token (REI_STANDIN); loopback is for the health check and the gateway's own CLI.
#   shared    <net>.234.2:8781. Models, search and embeddings only; every other path answers 404 there. Another compose
#             project joins gateway-shared (external, name rei-gateway-shared for the default REI_PROJECT) and calls http://rei-gateway:8781 with
#             its own caller token.
#
# The reader (docs/reader.md, docs/adr/0020) is reached only through the gateway: POST /read on either listener, with the
# caller's token, scope and budget. It fetches pages through its own forward proxy and renders the ones that need
# JavaScript; nothing outside the reader-internal network can call it.
#
# Storage (docs/storage.md, docs/adr/0021). Garage and Qdrant keep Rei's files and indexes. An outside caller that needs
# object storage is signed up with ./rei callers add <id> --storage: its own bucket and its own Garage key, which it
# uses directly over rei-storage-shared (<REI_PROJECT>-storage-shared). Storage is not behind the gateway, and the gateway and reader never depend on it.
# Qdrant is for Rei only for now: it is not on the storage-shared network.
#
# Networks:
#   gateway-admin   the gateway and Rei's control plane. No route out.
#   gateway-shared  the gateway and whatever outside callers join. No route out, and no path to anything of Rei's.
#   egress          the gateway. Model providers, search providers and the embedding endpoint.
#   reader-internal the gateway and the reader (<net>.236.2:8790, alias `reader`). No route out.
#   reader-egress   the reader. The public internet.
#   storage         Garage (<net>.237.2), Qdrant (.3) and Rei's control plane (<REI_PROJECT>-storage). No route out. Garage's admin API
#                   binds here only.
#   storage-shared  Garage and whatever outside callers join (<REI_PROJECT>-storage-shared). No route out. S3 only: Garage's admin
#                   and RPC ports and Qdrant are not on it. Callers on it can reach each other.
# Rei's egress proxy refuses all the internal subnets (EGRESS_REFUSE_CIDRS in compose.yaml), so nothing an agent drives
# reaches the gateway, the reader or storage.
#
# <net> is REI_NET (two octets, default 10.89) and every fixed subnet and address derives from it; the named networks are
# prefixed with REI_PROJECT (default rei), so rei-gateway-shared and rei-storage-shared are what other projects join. A
# second stack on one machine sets both, with its own Dodai (docs/installation.md, "A second stack on one machine").
# Garage's admin API address is fixed in garage/garage.toml (<net> cannot reach a config file): see that file.
#
# Every data volume is external, with a fixed Rei-prefixed name that containers/init.sh creates: compose never removes an
# external volume, so `docker compose -p dodai down -v` cannot delete provider sign-ins, caller tokens, call logs, reader
# records, Rei's files or its indexes. Compose fails with "external volume not found" if init.sh was skipped.
name: dodai

x-logging: &logging
  driver: local
  options: { max-size: 10m, max-file: "5" }

services:
  gateway:
    logging: *logging
    image: ${REI_IMAGES:-ghcr.io/sheldonxxxx}/rei-gateway:${REI_VERSION:-dev}
    read_only: true
    tmpfs: [/tmp]
    environment:
      REI_CODEX_IMAGES: ${REI_CODEX_IMAGES:-0}
      REI_STANDIN: ${REI_STANDIN:?run containers/init.sh}
      REI_LOG_LEVEL: ${REI_GATEWAY_LOG_LEVEL:-${REI_LOG_LEVEL:-info}}
      # Must match the gateway's fixed addresses below. The full app never listens on gateway-shared.
      GATEWAY_HOST: "${REI_NET:-10.89}.235.2,127.0.0.1"
      GATEWAY_SHARED_LISTEN: "${REI_NET:-10.89}.234.2:8781"
      # Optional caps on Rei's own calls in flight (JSON, the shape of a caller budget). Unset: no caps.
      GATEWAY_REI_BUDGET: ${GATEWAY_REI_BUDGET:-}
      # Explicit hostname exceptions for local MCP servers. Empty by default.
      GATEWAY_MCP_DEV_HOSTS: ${GATEWAY_MCP_DEV_HOSTS:-}
      # Web search (providers, Exa auth, an external SearXNG, every API key) is configured in the web app, not here.
      GATEWAY_EMBEDDING_URL: ${GATEWAY_EMBEDDING_URL:-}
      GATEWAY_EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL:-}
      # Web Push: the VAPID `sub` claim push services may use to reach the operator.
      REI_FCM_SERVICE_ACCOUNT_JSON: ${REI_FCM_SERVICE_ACCOUNT_JSON:-}
      REI_VAPID_SUBJECT: ${REI_VAPID_SUBJECT:-https://example.com/}
      # The shared reader, for POST /read.
      GATEWAY_READER_URL: http://reader:8790
    depends_on:
      reader: { condition: service_healthy }
    volumes:
      - gateway-data:/data
    networks:
      gateway-admin: { ipv4_address: "${REI_NET:-10.89}.235.2" }
      gateway-shared: { ipv4_address: "${REI_NET:-10.89}.234.2", aliases: [rei-gateway] }
      egress: {}
      reader-internal: {}
    restart: unless-stopped

  reader:
    logging: *logging
    image: ${REI_IMAGES:-ghcr.io/sheldonxxxx}/rei-reader:${REI_VERSION:-dev}
    read_only: true
    tmpfs: [/tmp]
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REI_LOG_LEVEL: ${REI_READER_LOG_LEVEL:-${REI_LOG_LEVEL:-info}}
      READER_HOST: "${REI_NET:-10.89}.236.2"
      # Render engines in the order they are tried (one name turns the other off), slots per engine, shadow sample.
      READER_ENGINES: ${REI_READER_ENGINES:-moli,chromium}
      READER_RENDER_SLOTS: ${REI_READER_RENDER_SLOTS:-2}
      READER_SHADOW_RATE: ${REI_READER_SHADOW_RATE:-0.1}
      # Networks the reader's proxy never connects into, besides its own interfaces' subnets: the stack's.
      READER_REFUSE_CIDRS: "${REI_NET:-10.89}.231.0/24,${REI_NET:-10.89}.232.0/24,${REI_NET:-10.89}.233.0/24,${REI_NET:-10.89}.234.0/24,${REI_NET:-10.89}.235.0/24,${REI_NET:-10.89}.236.0/24,${REI_NET:-10.89}.237.0/24,${REI_NET:-10.89}.238.0/24"
    volumes:
      - reader-data:/data
    networks:
      reader-internal: { ipv4_address: "${REI_NET:-10.89}.236.2", aliases: [reader] }
      reader-egress: {}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://${REI_NET:-10.89}.236.2:8790/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  # Rei's file bytes: attachments, Library versions, published agent files. One node, replication factor 1, private
  # bucket, no published port. The bucket and its single key are created on first start from GARAGE_DEFAULT_* in
  # .secrets/secrets.env (Garage >= 2.3 bootstraps both), and the RPC secret and admin token come from the same file,
  # so `docker compose up` needs no provisioning step; the same command recreates the container without touching them. The image is distroless: no shell, so the health check runs the Garage CLI itself. Callers' buckets and keys are made with `garage json-api` inside this container (./rei callers ... --storage): over RPC, with no token, and nothing published.
  garage:
    logging: *logging
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run containers/init.sh}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run containers/init.sh}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?run containers/init.sh}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?run containers/init.sh}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?run containers/init.sh}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 512
    volumes:
      - ./garage/garage.toml:/etc/garage/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      storage: { ipv4_address: "${REI_NET:-10.89}.237.2", aliases: [rei-garage] }
      storage-shared: { aliases: [rei-garage] }
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage/garage.toml", "status"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # Rei's search indexes: BM25 over the history passages and the dense vectors of the configured embedding model.
  # Derived data: SQLite stays the authority, and an empty Qdrant only means search catches up. No published port, API key
  # required, and Rei is its only user for now (it is on rei-storage only). Snapshots go to their own volume; they speed a restore up, they are not what it needs (docs/storage.md).
  qdrant:
    logging: *logging
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY:?run containers/init.sh}
      QDRANT__CLUSTER__ENABLED: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    tmpfs: [/qdrant/config]
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks:
      storage: { ipv4_address: "${REI_NET:-10.89}.237.3", aliases: [rei-qdrant] }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  # Each fixed address is below .128; ip_range keeps Docker's own picks (other projects' containers joining while the
  # gateway or reader is being recreated) at .128 and above, so they can never take one.
  gateway-admin:
    name: "${REI_PROJECT:-rei}-gateway-admin"
    internal: true
    ipam: { config: [{ subnet: "${REI_NET:-10.89}.235.0/24", ip_range: "${REI_NET:-10.89}.235.128/25" }] }
  gateway-shared:
    name: "${REI_PROJECT:-rei}-gateway-shared"
    internal: true
    ipam: { config: [{ subnet: "${REI_NET:-10.89}.234.0/24", ip_range: "${REI_NET:-10.89}.234.128/25" }] }
  egress: {}
  reader-internal:
    name: "${REI_PROJECT:-rei}-reader-internal"
    internal: true
    ipam: { config: [{ subnet: "${REI_NET:-10.89}.236.0/24", ip_range: "${REI_NET:-10.89}.236.128/25" }] }
  reader-egress: {}
  storage:
    name: "${REI_PROJECT:-rei}-storage"
    internal: true
    ipam: { config: [{ subnet: "${REI_NET:-10.89}.237.0/24", ip_range: "${REI_NET:-10.89}.237.128/25" }] }
  storage-shared:
    name: "${REI_PROJECT:-rei}-storage-shared"
    internal: true
    ipam: { config: [{ subnet: "${REI_NET:-10.89}.238.0/24", ip_range: "${REI_NET:-10.89}.238.128/25" }] }

volumes:
  gateway-data: { external: true, name: "${REI_PROJECT:-rei}_gateway-data" }
  reader-data: { external: true, name: "${REI_PROJECT:-rei}_reader-data" }
  garage-meta: { external: true, name: "${REI_PROJECT:-rei}_garage-meta" }
  garage-data: { external: true, name: "${REI_PROJECT:-rei}_garage-data" }
  qdrant-data: { external: true, name: "${REI_PROJECT:-rei}_qdrant-data" }
  qdrant-snapshots: { external: true, name: "${REI_PROJECT:-rei}_qdrant-snapshots" }
