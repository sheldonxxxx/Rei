name: Bug report
description: Something in Rei does not work as documented
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, tokens, passwords or personal data. For security problems use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rei version or commit
      description: Output of `./rei status`, a release tag, or a commit hash.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen
      options:
        - Web app
        - Android app
        - CLI (./rei)
        - Server or agent runtime
        - Gateway, reader or egress
        - Sandbox or browser containers
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, browser or device, and the model provider you use.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output of `./rei doctor` is helpful. Remove secrets first.
      render: shell
