# Weekly dependency updates. Minor and patch updates are grouped into one pull request per ecosystem; major updates
# arrive on their own so each can be reviewed separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(android)"
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /containers/browser
      - /containers/control
      - /containers/egress
      - /containers/exec
      - /containers/gateway
      - /containers/reader
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
