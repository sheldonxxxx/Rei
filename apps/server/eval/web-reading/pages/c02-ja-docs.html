<h1>APIキーの管理</h1>
<p>Larkspur の API を呼び出すには API キーが必要です。キーはプロジェクトごとに発行されます。</p>
<h2>キーのローテーション</h2>
<p>セキュリティのため、API キーは90日ごとにローテーションすることを推奨します。古いキーは新しいキーの発行後24時間有効です。</p>
<h2>スコープ</h2>
<p>キーには読み取り専用と読み書きの二種類のスコープがあります。本番環境では必要最小限のスコープを使用してください。</p>
